<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>打开 DSH · 手机入口</title>
<style>
  :root{--bg:#0e0f13;--card:#171920;--line:#2a2d38;--ink:#e8eaf0;--dim:#9aa0ae;--accent:#4d6bfe;--ok:#38c172;--warn:#f0a020}
  @media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--card:#fff;--line:#e3e6ee;--ink:#1b1d24;--dim:#666e7d}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
        border-radius:18px;padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px rgba(240,160,32,.15);flex:0 0 auto}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(56,193,114,.15)}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
  .hint{margin:0 0 16px;color:var(--dim);word-break:break-all}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;
       padding:12px 16px;border-radius:12px;font-weight:600}
  .btn[hidden]{display:none}
  .meta{margin:14px 0 0;font-size:12px;color:var(--dim);line-height:1.7}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:rgba(127,127,127,.14);
       padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<main class="card">
  <div class="head"><span class="dot" id="dot"></span><h1>DSH · 手机入口</h1></div>
  <p class="hint" id="hint">正在获取最新隧道地址…</p>
  <a class="btn" id="go" href="#" hidden>手动打开</a>
  <p class="meta" id="meta">这个页面只负责跳转：电脑关机、DSH 没开、隧道断开时，点进来也打不开。</p>
</main>
<script>
(function () {
  var hint = document.getElementById('hint');
  var go = document.getElementById('go');
  var meta = document.getElementById('meta');
  var dot = document.getElementById('dot');

  function show(text, isOk) {
    hint.textContent = text;
    dot.className = 'dot' + (isOk ? ' ok' : '');
  }

  fetch('target.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      if (!d || !d.url) throw new Error('no url');
      show('正在打开 ' + d.url, true);
      go.href = d.url;
      go.hidden = false;
      meta.textContent = '最后更新：' + (d.updatedAt || '未知') + ' · 当前隧道：' + d.url;
      setTimeout(function () { location.replace(d.url); }, 300);
    })
    .catch(function (e) {
      show('没拿到隧道地址（' + e.message + '）');
      meta.textContent = '可能是 target.json 读取失败，或仓库刚更新还在构建。稍等 1 分钟再刷新。';
      dot.className = 'dot';
    });
})();
</script>
</body>
</html>
